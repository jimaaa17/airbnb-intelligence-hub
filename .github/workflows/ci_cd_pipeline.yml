name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. API & ML Pipeline Quality Gate
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest

      - name: Validate ML & API Compilation
        run: |
          python -m py_compile services/api/app/main.py
          python -m py_compile services/api/app/schemas/contracts.py
          python -m py_compile services/api/ml/features/transformers.py
          python -m py_compile services/api/ml/features/definitions.py
          python -m py_compile services/api/ml/evaluation/metrics.py
          python -m py_compile services/api/ml/evaluation/shap_diagnostics.py
          python -m py_compile services/api/ml/tracking/tracker.py

      - name: Train & Register Models in MLflow Registry
        run: |
          cd services/api
          PYTHONPATH=. python ml/train_all.py

      - name: Run ML Unit, Registry & Regression Tests
        run: |
          cd services/api
          PYTHONPATH=. pytest ml/tests/ -v

      - name: Run MLOps & SME Quality Gate
        run: |
          cd services/api
          PYTHONPATH=. python ml/evaluation/eval_gate.py

  # 2. Frontend Next.js Quality Gate
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build Next.js Production Bundle
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # 3. Docker Container Build Verification
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          push: false
          tags: airbnb-intelligence-api:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          tags: airbnb-intelligence-web:latest
